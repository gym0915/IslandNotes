<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Island Notes · Dynamic Island Note Prototype</title>
<style>
  :root {
    --bg: oklch(97.3% 0 0);
    --surface: oklch(100% 0 0);
    --fg: oklch(17.8% 0 0);
    --muted: oklch(65.5% 0.007 286);
    --border: oklch(91.8% 0.002 286);
    --accent: oklch(17.8% 0 0);
    --live: oklch(54% 0.13 145);
    --danger: oklch(55% 0.19 25);
    --island: oklch(7% 0 0);
    --glass: color-mix(in oklch, var(--surface) 76%, transparent);
    --glass-border: color-mix(in oklch, white 80%, var(--border));
    --shadow: 0 18px 44px color-mix(in oklch, black 11%, transparent),
              inset 0 1px 0 color-mix(in oklch, white 88%, transparent);
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --safe-top: 54px;
  }
  [data-theme="dark"] {
    --bg: oklch(0% 0 0);
    --surface: oklch(21% 0 0);
    --fg: oklch(97% 0 0);
    --muted: oklch(65% 0.006 286);
    --border: oklch(31% 0.004 286);
    --accent: oklch(97% 0 0);
    --glass: color-mix(in oklch, var(--surface) 84%, transparent);
    --glass-border: color-mix(in oklch, white 14%, var(--border));
    --shadow: 0 20px 48px color-mix(in oklch, black 48%, transparent),
              inset 0 1px 0 color-mix(in oklch, white 12%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 28px 16px 40px;
    overflow-x: hidden;
    background: oklch(95.5% 0.006 255);
    color: var(--fg);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .lucide-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .lucide {
    display: block;
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  :where(button, [tabindex]):focus-visible {
    outline: 3px solid color-mix(in oklch, var(--fg) 52%, transparent);
    outline-offset: 3px;
  }
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 54px;
    background: oklch(6% 0 0);
    box-shadow: 0 0 0 2px oklch(18% 0 0), 0 0 0 7px oklch(26% 0 0),
                0 42px 84px color-mix(in oklch, black 32%, transparent);
    overflow: hidden;
    user-select: none;
  }
  .phone-screen {
    position: absolute;
    inset: 10px;
    border-radius: 44px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
  }
  .status-bar {
    position: absolute;
    inset: 0 0 auto;
    height: var(--safe-top);
    z-index: 80;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    padding: 0 28px 10px;
    pointer-events: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .status-bar .right { justify-self: end; display: flex; align-items: center; gap: 6px; }

  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    z-index: 90;
    width: 126px;
    height: 44px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    overflow: hidden;
    background: var(--island);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 24px color-mix(in oklch, black 26%, transparent);
    transition: width .38s cubic-bezier(.2,.8,.2,1),
                height .38s cubic-bezier(.2,.8,.2,1),
                border-radius .38s;
  }
  .island:not(.live) { cursor: default; }
  .island:not(.live) .island-compact { display: none; }
  .island.expanded { width: 340px; height: 110px; border-radius: 30px; align-items: stretch; }
  .island-compact {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    height: 100%;
    padding: 0 16px;
  }
  .island.expanded .island-compact { display: none; }
  .note-glyph {
    position: relative;
    width: 19px;
    height: 19px;
    flex: 0 0 auto;
    border: 1.5px solid currentColor;
    border-radius: 5px;
    color: white;
  }
  .note-glyph::after {
    content: "";
    position: absolute;
    left: 4px; right: 4px; top: 5px;
    height: 1.5px;
    background: currentColor;
    box-shadow: 0 4px 0 currentColor, 0 8px 0 currentColor;
    opacity: .8;
  }
  .island-expanded {
    display: none;
    width: 100%;
    padding: 15px 17px;
    align-items: flex-start;
    gap: 13px;
  }
  .island.expanded .island-expanded { display: flex; }
  .island-copy { flex: 1; min-width: 0; padding-top: 1px; }
  .island-text {
    color: oklch(96% 0 0);
    font-size: 13px;
    line-height: 1.35;
    white-space: pre-line;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .island-hint {
    position: absolute;
    top: 63px;
    left: 50%;
    z-index: 75;
    transform: translateX(-50%) translateY(-4px);
    padding: 6px 10px;
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    background: var(--glass);
    color: var(--muted);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    font-size: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .island-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .screen {
    position: absolute;
    inset: 0;
    padding-top: var(--safe-top);
    display: none;
    flex-direction: column;
    background: var(--bg);
  }
  .screen.active { display: flex; animation: screen-in 180ms cubic-bezier(.2,.8,.2,1); }
  @keyframes screen-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .nav {
    min-height: 64px;
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .nav-title {
    font: 760 20px/1 var(--display);
    letter-spacing: -.025em;
  }
  .nav-side { width: 48px; display: flex; align-items: center; }
  .nav-side.end { justify-content: flex-end; }
  .glass-btn {
    appearance: none;
    min-width: 48px;
    min-height: 48px;
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    background: var(--glass);
    color: var(--fg);
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px) saturate(145%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 15px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease, background .2s ease;
  }
  .glass-btn:active:not(:disabled) { transform: scale(.96); }
  .glass-btn:disabled { opacity: .34; cursor: default; }
  @media (hover: hover) {
    .glass-btn:hover:not(:disabled) { background: color-mix(in oklch, var(--surface) 90%, transparent); }
  }
  .glass-btn.icon-only { width: 48px; padding: 0; }
  .glass-btn .lucide {
    width: 21px; height: 21px;
  }
  .glass-btn.live-on {
    border-color: color-mix(in oklch, var(--live) 35%, var(--glass-border));
  }
  .glass-btn.live-on .action-dot {
    background: var(--live);
    animation: live-dot-breathe 2.4s ease-in-out infinite;
    transform-origin: center;
    will-change: transform, opacity;
  }
  @keyframes live-dot-breathe {
    0%, 100% { opacity: .82; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.16); }
  }

  .compose-body {
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    padding: 66px 18px 28px;
    display: flex;
    align-items: stretch;
    justify-content: flex-end;
  }
  .note-card {
    position: relative;
    width: 100%;
    max-height: 438px;
    flex: 1;
    padding: 28px 24px 58px;
    overflow: auto;
    border: 0;
    border-radius: 31px;
    background: color-mix(in oklch, var(--surface) 82%, transparent);
    box-shadow: 0 8px 24px color-mix(in oklch, black 7%, transparent),
                0 1px 4px color-mix(in oklch, black 4%, transparent);
    cursor: text;
  }
  [data-theme="dark"] .note-card {
    background: color-mix(in oklch, var(--surface) 38%, transparent);
    box-shadow: 0 10px 28px color-mix(in oklch, black 38%, transparent),
                inset 0 1px 0 color-mix(in oklch, white 7%, transparent);
  }
  .note-card.editing {
    box-shadow: 0 10px 28px color-mix(in oklch, black 8%, transparent),
                inset 0 0 0 1px color-mix(in oklch, var(--accent) 10%, transparent);
  }
  .note-rendered,
  .note-editor {
    font-size: 18px;
    line-height: 1.55;
    letter-spacing: -.014em;
    color: var(--fg);
  }
  .note-rendered ul { list-style: none; }
  .note-rendered li { position: relative; padding-left: 20px; }
  .note-rendered li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: .72em;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: color-mix(in oklch, var(--fg) 66%, transparent);
  }
  .note-rendered p { min-height: 1.55em; }
  .note-rendered .empty { color: var(--muted); }
  .note-editor {
    display: none;
    width: 100%;
    min-height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    background: transparent;
    user-select: text;
  }
  .note-card.editing .note-rendered { display: none; }
  .note-card.editing .note-editor { display: block; }
  .char-ring {
    --progress: 0deg;
    position: absolute;
    right: 17px;
    bottom: 15px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: conic-gradient(var(--accent) var(--progress), color-mix(in oklch, var(--muted) 22%, transparent) 0);
    cursor: pointer;
  }
  .char-ring::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: inherit;
    background: color-mix(in oklch, var(--surface) 94%, transparent);
  }
  .char-tip {
    position: absolute;
    right: 64px;
    bottom: 19px;
    z-index: 3;
    max-width: 210px;
    padding: 9px 12px;
    border-radius: 14px;
    background: color-mix(in oklch, var(--fg) 92%, transparent);
    color: var(--bg);
    font-size: 11px;
    font-weight: 650;
    opacity: 0;
    transform: translateX(6px);
    pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  .char-tip.show { opacity: 1; transform: translateX(0); }

  .action-row {
    z-index: 5;
    padding: 12px 28px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .action-row .glass-btn { width: 54px; height: 54px; padding: 0; }
  .action-row .glass-btn span:not(.action-dot) {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .action-row #btnLive {
    width: 132px;
    padding: 0 18px;
    background: transparent;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
  }
  @media (hover: hover) {
    .action-row #btnLive:hover:not(:disabled) { background: transparent; }
  }
  .action-row #btnLive span:not(.action-dot) {
    position: static;
    width: auto; height: auto;
    overflow: visible;
    clip: auto;
  }
  .action-dot {
    width: 15px; height: 15px;
    border: 2px solid currentColor;
    border-radius: 50%;
    background: transparent;
  }

  .keyboard {
    position: relative;
    z-index: 1;
    display: none;
    padding: 12px 8px 24px;
    gap: 7px;
    border-top: 1px solid var(--border);
    background: color-mix(in oklch, var(--bg) 42%, oklch(89% .01 260));
  }
  [data-theme="dark"] .keyboard { background: oklch(16% 0 0); }
  .keyboard.show { display: grid; animation: keyboard-in 200ms cubic-bezier(.2,.8,.2,1); }
  @keyframes keyboard-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #screen-compose:has(.keyboard.show) .compose-body { padding: 8px 18px; }
  #screen-compose:has(.keyboard.show) .note-card { max-height: none; border-radius: 28px; }
  #screen-compose:has(.keyboard.show) .action-row { display: none; }
  .kb-done {
    width: calc(100% - 36px);
    min-height: 48px;
    justify-self: center;
    margin-bottom: 5px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    box-shadow: var(--shadow);
    font-size: 13px;
    font-weight: 750;
    white-space: nowrap;
    cursor: pointer;
  }
  .keyboard.show .kb-done {
    animation: done-slide-out 300ms cubic-bezier(.22,.78,.24,1) both;
  }
  @keyframes done-slide-out {
    from { opacity: .2; transform: translateY(-58px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .kb-rows { display: grid; gap: 7px; }
  .kb-row { display: flex; justify-content: center; gap: 5px; }
  .kb-key {
    flex: 1;
    max-width: 34px;
    height: 44px;
    border: 0;
    border-radius: 7px;
    background: var(--surface);
    color: var(--fg);
    box-shadow: 0 1px 0 color-mix(in oklch, black 18%, transparent);
    font-size: 15px;
    cursor: pointer;
  }
  .kb-key.wide { max-width: 54px; flex: 1.5; font-size: 12px; color: var(--muted); }
  .kb-key.space { max-width: none; flex: 5; }
  .kb-key .lucide { width: 18px; height: 18px; margin: auto; }

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 55;
    display: none;
    background: color-mix(in oklch, black 8%, transparent);
  }
  .scrim.show { display: block; }
  .more-menu {
    position: absolute;
    top: 96px;
    right: 18px;
    z-index: 60;
    min-width: 210px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 2px;
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    background: var(--glass);
    box-shadow: var(--shadow);
    backdrop-filter: blur(28px) saturate(150%);
  }
  .more-menu.open { display: flex; transform-origin: top right; animation: pop-in 170ms cubic-bezier(.2,.8,.2,1); }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-5px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .more-menu button {
    min-height: 52px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 13px;
    border: 0;
    border-radius: 17px;
    background: transparent;
    color: var(--fg);
    font-size: 16px;
    text-align: left;
    cursor: pointer;
  }
  .more-menu button:active { background: color-mix(in oklch, var(--fg) 7%, transparent); }
  .more-menu .lucide { width: 21px; height: 21px; }

  .list-scroll { flex: 1; overflow: auto; padding: 12px 18px 30px; }
  .library-item {
    width: 100%;
    min-height: 92px;
    padding: 17px 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 46px;
    align-items: center;
    gap: 12px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    text-align: left;
    cursor: pointer;
  }
  .library-snippet {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 16px;
    line-height: 1.4;
  }
  .library-date { margin-top: 7px; color: var(--muted); font: 500 11px/1 var(--mono); }
  .restore-mark {
    width: 44px; height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid var(--glass-border);
    border-radius: 50%;
    background: var(--glass);
    box-shadow: var(--shadow);
  }
  .restore-mark .lucide { width: 20px; height: 20px; }
  .empty-state {
    height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    padding: 40px 24px;
    color: var(--muted);
    text-align: center;
  }
  .empty-icon {
    width: 58px; height: 50px;
    margin-bottom: 18px;
    border: 4px solid currentColor;
    border-radius: 9px;
    opacity: .6;
  }
  .empty-state h3 { margin-bottom: 7px; color: var(--fg); font-size: 19px; }
  .empty-state p { max-width: 240px; font-size: 13px; line-height: 1.5; }

  .settings-label { padding: 4px 24px 9px; color: var(--muted); font-size: 11px; }
  .settings-group {
    margin: 0 18px 22px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
    border-radius: 27px;
    background: var(--surface);
  }
  .settings-row {
    width: 100%;
    min-height: 62px;
    padding: 12px 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-size: 15px;
    text-align: left;
  }
  button.settings-row { cursor: pointer; }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row .left { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .settings-row .icon { width: 27px; display: grid; place-items: center; }
  .settings-row .lucide { width: 22px; height: 22px; }
  .appearance-mode-icon {
    display: block;
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }
  .settings-row .value { margin-left: auto; color: var(--muted); font-size: 13px; }
  .settings-row .chev { color: var(--muted); font-size: 22px; }
  .settings-row .chev .lucide { width: 18px; height: 18px; }
  .settings-group.appearance-group {
    position: relative;
    z-index: 25;
    overflow: visible;
  }
  .appearance-trigger { border-bottom: 0; }
  .appearance-current {
    margin-left: auto;
    color: var(--muted);
    font-size: 14px;
  }
  .appearance-chevrons {
    width: 15px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 7px;
  }
  .appearance-chevrons .lucide { width: 16px; height: 16px; }
  .appearance-menu {
    position: absolute;
    top: 49px;
    right: 10px;
    z-index: 30;
    width: 218px;
    padding: 8px;
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    background: color-mix(in oklch, var(--surface) 88%, transparent);
    box-shadow: 0 24px 56px color-mix(in oklch, black 24%, transparent),
                inset 0 1px 0 color-mix(in oklch, white 55%, transparent);
    backdrop-filter: blur(30px) saturate(150%);
  }
  .appearance-menu[hidden] { display: none; }
  .appearance-menu:not([hidden]) { animation: pop-in 170ms cubic-bezier(.2,.8,.2,1); }
  .appearance-option {
    width: 100%;
    min-height: 50px;
    padding: 0 14px 0 9px;
    display: grid;
    grid-template-columns: 25px 1fr;
    align-items: center;
    gap: 8px;
    border: 0;
    border-radius: 16px;
    background: transparent;
    color: var(--fg);
    font-size: 16px;
    text-align: left;
    cursor: pointer;
  }
  .appearance-option:hover,
  .appearance-option:focus-visible { background: color-mix(in oklch, var(--fg) 7%, transparent); }
  .appearance-check { width: 19px; height: 19px; opacity: 0; }
  .appearance-option[aria-selected="true"] .appearance-check { opacity: 1; }
  .brand-footer { margin: auto 0 24px; text-align: center; color: var(--muted); }
  .brand-mark {
    width: 54px; height: 54px;
    margin: 0 auto 10px;
    display: grid;
    place-items: center;
    border: 2px solid currentColor;
    border-radius: 17px;
  }
  .brand-footer strong { display: block; color: var(--fg); font-size: 15px; }
  .brand-footer span { font-size: 11px; }
  .brand-footer em { display: block; margin-top: 12px; font-size: 12px; }

  .modal-scrim {
    position: absolute;
    inset: 0;
    z-index: 120;
    display: grid;
    place-items: end center;
    padding: 0 18px 32px;
    background: color-mix(in oklch, black 28%, transparent);
    backdrop-filter: blur(6px);
  }
  .modal-scrim[hidden] { display: none; }
  .modal-scrim:not([hidden]) { animation: fade-in 160ms ease-out; }
  .confirm-card {
    width: 100%;
    padding: 22px;
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    background: color-mix(in oklch, var(--surface) 94%, transparent);
    box-shadow: 0 24px 64px color-mix(in oklch, black 28%, transparent);
    animation: sheet-in 210ms cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes sheet-in {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .confirm-card h3 { font-size: 19px; }
  .confirm-card p { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.45; }

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  defaultNote: "",
  sampleLibrary: false,
  defaultTheme: "system"
}/*EDITMODE-END*/;

function readThemeMode() {
  try { return localStorage.getItem("island-notes-theme"); }
  catch { return null; }
}

const LIMIT = 240;
const state = {
  content: TWEAK_DEFAULTS.defaultNote,
  live: false,
  editing: false,
  screen: "compose",
  theme: "light",
  themeMode: readThemeMode() || TWEAK_DEFAULTS.defaultTheme,
  library: TWEAK_DEFAULTS.sampleLibrary ? [
    { id: "n1", content: "- Buy coffee beans\n- Reply with a meeting time", date: "Yesterday, 6:24 PM" },
    { id: "n2", content: "Design review notes\n\nConfirm the icon size and expanded Dynamic Island state", date: "Monday, 11:02 AM" }
  ] : []
};

const $ = id => document.getElementById(id);
const els = {
  phoneScreen: $("phoneScreen"), island: $("island"), islandHint: $("islandHint"),
  islandBody: $("islandExpandedBody"), noteCard: $("noteCard"),
  noteRendered: $("noteRendered"), noteEditor: $("noteEditor"), keyboard: $("keyboard"),
  moreMenu: $("moreMenu"), scrim: $("scrim"), btnLive: $("btnLive"),
  btnLibrary: $("btnLibrary"), btnDelete: $("btnDelete"), libraryList: $("libraryList"),
  charRing: $("charRing"), charTip: $("charTip"), deleteModal: $("deleteModal"),
  toast: $("toast"),
  appearanceGroup: $("appearanceGroup"), appearanceTrigger: $("appearanceTrigger"),
  appearanceValue: $("appearanceValue"), appearanceMenu: $("appearanceMenu")
};

const segmenter = typeof Intl !== "undefined" && Intl.Segmenter
  ? new Intl.Segmenter("en", { granularity: "grapheme" }) : null;
function graphemes(value) {
  const text = String(value || "");
  return segmenter ? Array.from(segmenter.segment(text), item => item.segment) : Array.from(text);
}
function countChars(value) { return graphemes(value).length; }
function clipToLimit(value) { return graphemes(value).slice(0, LIMIT).join(""); }
function hasContent() { return Boolean(String(state.content || "").trim()); }
function escapeHtml(value) {
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderMarkdown(md) {
  const raw = String(md || "");
  if (!raw.trim()) return '<p class="empty">Add something you want to keep close, then go live on Dynamic Island.</p>';
  let html = "", inList = false;
  for (const line of raw.split("\n")) {
    const match = line.match(/^\s*[-*+]\s+(.*)$/);
    if (match) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${escapeHtml(match[1] || " ")}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<p>${escapeHtml(line) || "&nbsp;"}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}
function systemText(md) {
  return String(md || "").split("\n").map(line => line.replace(/^\s*[-*+]\s+/, "• ")).join("\n");
}
function showToast(message) {
  els.toast.textContent = message;
  els.toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1700);
}
function showCharTip() {
  const used = countChars(state.content);
  els.charTip.textContent = `${used} used · ${LIMIT - used} remaining`;
  els.charTip.classList.add("show");
  clearTimeout(showCharTip.timer);
  showCharTip.timer = setTimeout(() => els.charTip.classList.remove("show"), 1900);
}
function updateCharacterUI() {
  const used = countChars(state.content);
  els.charRing.style.setProperty("--progress", `${(used / LIMIT) * 360}deg`);
  els.charRing.setAttribute("aria-label", `${used} of ${LIMIT} characters used. ${LIMIT - used} remaining`);
}
function updateActions() {
  const enabled = hasContent();
  els.btnLibrary.disabled = !enabled;
  els.btnLive.disabled = !enabled;
  els.btnDelete.disabled = !enabled;
  els.btnLive.classList.toggle("live-on", state.live);
  els.btnLive.querySelector("span:last-child").textContent = state.live ? "Live" : "Go Live";
  els.btnLive.setAttribute("aria-label", state.live ? "Live on Dynamic Island. Tap to end" : "Go live on Dynamic Island");
}
function updateIsland() {
  const isLive = state.live && hasContent();
  els.island.setAttribute("aria-disabled", String(!isLive));
  els.island.tabIndex = isLive ? 0 : -1;
  els.island.setAttribute("aria-label", isLive
    ? "Live note in Dynamic Island. Press Enter to open the note."
    : "Dynamic Island is inactive");
  if (!isLive) {
    els.island.classList.remove("live", "expanded");
    els.island.setAttribute("aria-expanded", "false");
    els.islandHint.classList.remove("show");
    return;
  }
  els.island.classList.add("live");
  els.islandBody.textContent = systemText(state.content);
}
function renderLibrary() {
  if (!state.library.length) {
    els.libraryList.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><h3>Your Note Library is empty</h3><p>Notes you save here will appear with the most recent one first.</p></div>';
    return;
  }
  els.libraryList.innerHTML = state.library.map(item => `
    <button type="button" class="library-item" data-id="${item.id}" data-od-id="library-item-${item.id}">
      <span><span class="library-snippet">${escapeHtml(item.content).replace(/\n/g, "<br>")}</span><span class="library-date">${item.date}</span></span>
      <span class="restore-mark" aria-hidden="true"><svg class="lucide"><use href="#lucide-rotate-ccw"/></svg></span>
    </button>`).join("");
}
function renderAll({ preserveEditor = false } = {}) {
  els.noteRendered.innerHTML = renderMarkdown(state.content);
  if (!preserveEditor) els.noteEditor.value = state.content;
  updateCharacterUI();
  updateActions();
  updateIsland();
  renderLibrary();
}
function closeMore() {
  els.moreMenu.classList.remove("open");
  els.scrim.classList.remove("show");
  $("btnMore").setAttribute("aria-expanded", "false");
}
function setScreen(name) {
  state.screen = name;
  document.querySelectorAll(".screen").forEach(screen => screen.classList.toggle("active", screen.id === "screen-" + name));
  closeMore();
  closeAppearanceMenu();
  if (name !== "compose") exitEdit(true);
}
function enterEdit() {
  if (state.screen !== "compose") setScreen("compose");
  state.editing = true;
  els.noteCard.classList.add("editing");
  els.keyboard.classList.add("show");
  els.noteEditor.value = state.content;
  els.noteEditor.focus({ preventScroll: true });
}
function exitEdit(commit) {
  if (commit) state.content = clipToLimit(els.noteEditor.value);
  state.editing = false;
  els.noteCard.classList.remove("editing");
  els.keyboard.classList.remove("show");
  renderAll();
}
function syncEditorContent(showLimitWarning = true) {
  const raw = els.noteEditor.value;
  const clipped = clipToLimit(raw);
  if (clipped !== raw) {
    els.noteEditor.value = clipped;
    if (showLimitWarning) showToast("Maximum 240 characters");
  }
  state.content = clipped;
  els.noteRendered.innerHTML = renderMarkdown(state.content);
  updateCharacterUI();
  updateActions();
  if (state.live) {
    clearTimeout(syncEditorContent.liveTimer);
    syncEditorContent.liveTimer = setTimeout(updateIsland, 280);
  } else updateIsland();
}
function putInLibrary() {
  if (!hasContent()) return;
  state.library.unshift({ id: "n" + Date.now(), content: state.content, date: "Just now" });
  state.content = "";
  state.live = false;
  exitEdit(false);
  showToast("Added to Note Library");
}
function toggleLive() {
  if (state.editing) syncEditorContent();
  if (!hasContent()) { showToast("Add something before going live"); return; }
  state.live = !state.live;
  renderAll({ preserveEditor: state.editing });
  showToast(state.live ? "Live on Dynamic Island" : "Live ended");
  if (state.live) {
    els.islandHint.classList.add("show");
    setTimeout(() => els.islandHint.classList.remove("show"), 1800);
  }
}
function openDeleteModal() {
  if (!hasContent()) return;
  openDeleteModal.returnFocus = document.activeElement;
  els.deleteModal.hidden = false;
  $("cancelDelete").focus({ preventScroll: true });
}
function closeDeleteModal({ restoreFocus = true } = {}) {
  els.deleteModal.hidden = true;
  if (restoreFocus && openDeleteModal.returnFocus instanceof HTMLElement) {
    openDeleteModal.returnFocus.focus({ preventScroll: true });
  }
}
function confirmDelete() {
  state.content = "";
  state.live = false;
  closeDeleteModal({ restoreFocus: false });
  exitEdit(false);
  els.noteCard.focus({ preventScroll: true });
  showToast("Note deleted");
}

const keyboardLayouts = {
  letters: {
    1: "qwertyuiop".split(""),
    2: "asdfghjkl".split(""),
    3: ["⇧", ..."zxcvbnm".split(""), "⌫"],
    4: ["123", "bullet", "space", "return"]
  },
  symbols: {
    1: "1234567890".split(""),
    2: ["-", "/", ":", ";", "(", ")", "¥", "&", "@", "\""],
    3: [".", ",", "?", "!", "'", "⌫"],
    4: ["ABC", "bullet", "space", "return"]
  }
};
let shift = false;
let keyboardMode = "letters";
function renderKeyboard() {
  Object.entries(keyboardLayouts[keyboardMode]).forEach(([rowNumber, keys]) => {
    const row = document.querySelector(`.kb-row[data-row="${rowNumber}"]`);
    row.replaceChildren();
    keys.forEach(keyName => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "kb-key" + (keyName === "space" ? " space" : (keyName.length > 1 ? " wide" : ""));
      const label = keyName === "space" ? "Space" : keyName === "return" ? "Return" : keyName === "bullet" ? "List" : keyName;
      const iconName = keyName === "⇧" ? "arrow-up" : keyName === "⌫" ? "delete" : "";
      if (iconName) button.innerHTML = `<svg class="lucide" aria-hidden="true"><use href="#lucide-${iconName}"/></svg>`;
      else button.textContent = label;
      button.dataset.key = keyName;
      button.setAttribute("aria-label", keyName === "⌫" ? "Delete" : keyName === "⇧" ? "Shift" : label);
      row.appendChild(button);
    });
  });
}
renderKeyboard();
function replaceSelection(text) {
  const editor = els.noteEditor;
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? editor.value.length;
  const next = editor.value.slice(0, start) + text + editor.value.slice(end);
  const clipped = clipToLimit(next);
  editor.value = clipped;
  const caret = Math.min(start + text.length, clipped.length);
  editor.selectionStart = editor.selectionEnd = caret;
  if (clipped !== next) showToast("Maximum 240 characters");
  syncEditorContent(false);
  editor.focus({ preventScroll: true });
}
els.keyboard.addEventListener("click", event => {
  const key = event.target.closest("[data-key]");
  if (!key) return;
  const value = key.dataset.key;
  const editor = els.noteEditor;
  const start = editor.selectionStart ?? editor.value.length;
  const end = editor.selectionEnd ?? editor.value.length;
  if (value === "⌫") {
    if (start === end && start > 0) {
      const before = graphemes(editor.value.slice(0, start));
      before.pop();
      const nextBefore = before.join("");
      editor.value = nextBefore + editor.value.slice(end);
      editor.selectionStart = editor.selectionEnd = nextBefore.length;
      syncEditorContent(false);
    } else replaceSelection("");
  } else if (value === "return") replaceSelection("\n");
  else if (value === "space") replaceSelection(" ");
  else if (value === "bullet") replaceSelection("- ");
  else if (value === "⇧") {
    shift = !shift;
    key.setAttribute("aria-pressed", String(shift));
  } else if (value === "123" || value === "ABC") {
    keyboardMode = value === "123" ? "symbols" : "letters";
    shift = false;
    renderKeyboard();
    els.noteEditor.focus({ preventScroll: true });
  } else {
    replaceSelection(shift ? value.toUpperCase() : value);
    shift = false;
    if (keyboardMode === "letters") renderKeyboard();
  }
});

els.noteCard.addEventListener("click", event => {
  if (event.target.closest("#charRing")) return;
  if (!state.editing) enterEdit();
});
els.noteCard.addEventListener("keydown", event => {
  if (state.editing || !["Enter", " "].includes(event.key)) return;
  event.preventDefault();
  enterEdit();
});
els.noteEditor.addEventListener("input", () => syncEditorContent());
$("btnDone").addEventListener("click", () => exitEdit(true));
els.charRing.addEventListener("click", event => { event.stopPropagation(); showCharTip(); });
$("btnMore").addEventListener("click", () => {
  els.moreMenu.classList.toggle("open");
  const isOpen = els.moreMenu.classList.contains("open");
  els.scrim.classList.toggle("show", isOpen);
  $("btnMore").setAttribute("aria-expanded", String(isOpen));
});
els.scrim.addEventListener("click", closeMore);
els.btnLibrary.addEventListener("click", putInLibrary);
els.btnLive.addEventListener("click", toggleLive);
els.btnDelete.addEventListener("click", openDeleteModal);
$("cancelDelete").addEventListener("click", closeDeleteModal);
$("confirmDelete").addEventListener("click", confirmDelete);
els.deleteModal.addEventListener("click", event => { if (event.target === els.deleteModal) closeDeleteModal(); });
document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;
  if (!els.deleteModal.hidden) {
    event.preventDefault();
    closeDeleteModal();
  } else if (!els.appearanceMenu.hidden) {
    event.preventDefault();
    closeAppearanceMenu({ returnFocus: true });
  } else if (els.moreMenu.classList.contains("open")) {
    event.preventDefault();
    closeMore();
    $("btnMore").focus({ preventScroll: true });
  } else if (state.editing) {
    event.preventDefault();
    exitEdit(true);
    els.noteCard.focus({ preventScroll: true });
  }
});

document.body.addEventListener("click", event => {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const name = target.dataset.action.replace("go-", "");
  if (["compose", "library", "settings"].includes(name)) setScreen(name);
});
els.libraryList.addEventListener("click", event => {
  const item = event.target.closest(".library-item");
  if (!item) return;
  const index = state.library.findIndex(note => note.id === item.dataset.id);
  if (index < 0) return;
  const selected = state.library[index];
  state.library.splice(index, 1);
  if (hasContent()) state.library.unshift({ id: "n" + Date.now(), content: state.content, date: "Just now" });
  state.content = selected.content;
  state.live = false;
  setScreen("compose");
  renderAll();
  showToast("Restored as the current note");
});
$("btnFeedback").addEventListener("click", () => showToast("Feedback opened — demo"));
$("btnWebsite").addEventListener("click", () => showToast("islandnotes.app — demo"));
$("btnAbout").addEventListener("click", () => showToast("Island Notes 1.0"));

let pressTimer = null;
let longPressed = false;
els.island.addEventListener("pointerdown", () => {
  if (!state.live) return;
  longPressed = false;
  pressTimer = setTimeout(() => {
    longPressed = true;
    els.island.classList.add("expanded");
    els.island.setAttribute("aria-expanded", "true");
    els.islandHint.classList.remove("show");
  }, 420);
});
els.island.addEventListener("pointerup", () => {
  clearTimeout(pressTimer);
  if (!state.live || longPressed) return;
  els.island.classList.remove("expanded");
  els.island.setAttribute("aria-expanded", "false");
  setScreen("compose");
});
els.island.addEventListener("pointerleave", () => clearTimeout(pressTimer));
els.island.addEventListener("pointercancel", () => clearTimeout(pressTimer));
els.island.addEventListener("keydown", event => {
  if (!state.live || !["Enter", " "].includes(event.key)) return;
  event.preventDefault();
  if (els.island.classList.contains("expanded")) {
    els.island.classList.remove("expanded");
    els.island.setAttribute("aria-expanded", "false");
    setScreen("compose");
  } else {
    els.island.classList.add("expanded");
    els.island.setAttribute("aria-expanded", "true");
  }
});

const systemScheme = window.matchMedia("(prefers-color-scheme: dark)");
const themeLabels = { system: "Automatic", light: "Light", dark: "Dark" };
function closeAppearanceMenu({ returnFocus = false } = {}) {
  if (els.appearanceMenu.hidden) return;
  els.appearanceMenu.hidden = true;
  els.appearanceTrigger.setAttribute("aria-expanded", "false");
  if (returnFocus) els.appearanceTrigger.focus({ preventScroll: true });
}
function openAppearanceMenu() {
  els.appearanceMenu.hidden = false;
  els.appearanceTrigger.setAttribute("aria-expanded", "true");
  const selected = els.appearanceMenu.querySelector('[aria-selected="true"]');
  selected?.focus({ preventScroll: true });
}
function applyThemeMode(mode, { persist = false } = {}) {
  state.themeMode = Object.hasOwn(themeLabels, mode) ? mode : "system";
  state.theme = state.themeMode === "system"
    ? (systemScheme.matches ? "dark" : "light")
    : state.themeMode;
  els.phoneScreen.dataset.theme = state.theme;
  els.appearanceValue.textContent = themeLabels[state.themeMode];
  els.appearanceMenu.querySelectorAll("[data-theme-choice]").forEach(option => {
    option.setAttribute("aria-selected", String(option.dataset.themeChoice === state.themeMode));
  });
  if (persist) {
    try { localStorage.setItem("island-notes-theme", state.themeMode); }
    catch { /* Preview environments may disable storage. */ }
  }
}
els.appearanceTrigger.addEventListener("click", () => {
  if (els.appearanceMenu.hidden) openAppearanceMenu();
  else closeAppearanceMenu();
});
els.appearanceMenu.addEventListener("click", event => {
  const option = event.target.closest("[data-theme-choice]");
  if (!option) return;
  applyThemeMode(option.dataset.themeChoice, { persist: true });
  closeAppearanceMenu({ returnFocus: true });
});
els.appearanceMenu.addEventListener("keydown", event => {
  const options = [...els.appearanceMenu.querySelectorAll("[data-theme-choice]")];
  if (!['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const current = options.indexOf(document.activeElement);
  const nextIndex = event.key === 'Home' ? 0
    : event.key === 'End' ? options.length - 1
    : (current + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
  options[nextIndex].focus({ preventScroll: true });
});
document.addEventListener("click", event => {
  if (!els.appearanceGroup.contains(event.target)) closeAppearanceMenu();
});
systemScheme.addEventListener?.("change", () => {
  if (state.themeMode === "system") applyThemeMode("system");
});
applyThemeMode(state.themeMode);
renderAll();
</script>
</body>
</html>
